<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Intake — Package Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14181c;
  --panel: #1d2329;
  --panel-raised: #242b32;
  --line: #313a42;
  --text: #f2f4f6;
  --text-dim: #8b96a3;
  --accent: #ff6b1a;
  --accent-dim: #b84f10;
  --ok: #3ddc84;
  --danger: #ff5c5c;
  --slip: #f7f5ee;
  --slip-text: #2a2620;
  --slip-dim: #7a7264;

  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* ---- Header ---- */
header.top {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

header.top .brand {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.01em;
}

header.top .brand span {
  color: var(--accent);
}

header.top .tagline {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ---- Tabs ---- */
nav.tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
}

nav.tabs button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 12px 0;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}

nav.tabs button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

main {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.hidden { display: none !important; }

/* ---- Setup screen ---- */
.setup-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px;
}

.setup-card h2 {
  font-family: var(--font-display);
  margin: 0 0 8px;
  font-size: 16px;
}

.setup-card p {
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.5;
  margin: 0 0 12px;
}

.setup-card ol {
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.6;
  padding-left: 18px;
  margin: 0 0 14px;
}

textarea#configInput {
  width: 100%;
  min-height: 120px;
  background: #0f1317;
  border: 1px solid var(--line);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  border-radius: 8px;
  padding: 10px;
  resize: vertical;
}

/* ---- Scanner ---- */
.scan-stage {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  aspect-ratio: 3 / 4;
  border: 1px solid var(--line);
}

.scan-stage video,
.scan-stage canvas.freeze {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.scan-stage canvas.freeze { position: absolute; inset: 0; }

.reticle {
  position: absolute;
  inset: 12%;
  border: 1.5px solid rgba(255, 107, 26, 0.55);
  border-radius: 10px;
  pointer-events: none;
}
.reticle::before, .reticle::after,
.reticle > .c2, .reticle > .c3 {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  border: 2.5px solid var(--accent);
}
.reticle::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
.reticle::after { top: -2px; right: -2px; border-left: none; border-bottom: none; }
.reticle .c2 { bottom: -2px; left: -2px; border-right: none; border-top: none; }
.reticle .c3 { bottom: -2px; right: -2px; border-left: none; border-top: none; }

.scanline {
  position: absolute;
  left: 12%;
  right: 12%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  box-shadow: 0 0 8px 1px var(--accent);
  animation: sweep 2.2s ease-in-out infinite;
  opacity: 0.9;
}

@keyframes sweep {
  0% { top: 13%; }
  50% { top: 85%; }
  100% { top: 13%; }
}

.scan-status {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 10px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.75));
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.scan-status.busy { color: var(--accent); }
.scan-status.ok { color: var(--ok); }

.controls-row {
  display: flex;
  gap: 10px;
}

button.primary {
  background: var(--accent);
  color: #14181c;
  border: none;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  padding: 13px 18px;
  border-radius: 9px;
  cursor: pointer;
  flex: 1;
}
button.primary:disabled { opacity: 0.5; cursor: default; }

button.secondary {
  background: var(--panel-raised);
  color: var(--text);
  border: 1px solid var(--line);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 14px;
  padding: 13px 16px;
  border-radius: 9px;
  cursor: pointer;
}

button.link {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
  padding: 4px;
}

.people-toolbar {
  display: flex;
  justify-content: flex-end;
  margin: 2px 0 2px;
}

button.pill {
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel-raised);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 7px 16px;
  cursor: pointer;
}

button.pill.danger {
  border-color: var(--danger);
  color: var(--danger);
  background: rgba(255, 92, 92, 0.1);
}

button.pill.danger:hover {
  background: rgba(255, 92, 92, 0.18);
}

button.pill:disabled {
  opacity: 0.5;
  cursor: default;
}

/* ---- Packing slip confirm card ---- */
.slip {
  background: var(--slip);
  color: var(--slip-text);
  border-radius: 4px;
  position: relative;
  padding: 18px 18px 16px;
  font-family: var(--font-mono);
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,0,0,0.02) 8px, rgba(0,0,0,0.02) 9px);
}

.slip::before {
  content: "";
  position: absolute;
  top: -6px; left: 0; right: 0; height: 12px;
  background: radial-gradient(circle, var(--bg) 5px, transparent 5.5px) repeat-x;
  background-size: 16px 12px;
  background-position: 0 -1px;
}

.slip-eyebrow {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--slip-dim);
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.slip-field { margin-bottom: 12px; }

.slip-field label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--slip-dim);
  margin-bottom: 4px;
}

.slip-field input,
.slip-field select {
  width: 100%;
  border: none;
  border-bottom: 1.5px dashed #c9c2b0;
  background: transparent;
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--slip-text);
  padding: 4px 2px;
}

.slip-field input:focus,
.slip-field select:focus {
  outline: none;
  border-bottom-color: var(--accent-dim);
}

.dup-warning {
  background: #3a2210;
  border: 1px solid var(--accent-dim);
  color: #ffcfa8;
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 10px;
}

.ocr-raw {
  margin-top: 10px;
  font-size: 11px;
  color: var(--slip-dim);
  max-height: 70px;
  overflow-y: auto;
  border-top: 1px dashed #c9c2b0;
  padding-top: 8px;
  white-space: pre-wrap;
}

/* ---- People list ---- */
.people-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.people-header h2 {
  font-family: var(--font-display);
  font-size: 16px;
  margin: 0;
}
.people-header span {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.person-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}

.person-card .name {
  font-weight: 600;
  font-size: 14px;
}
.person-card .meta {
  color: var(--text-dim);
  font-size: 11px;
  font-family: var(--font-mono);
  margin-top: 2px;
}

.count-badge {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 20px;
  color: var(--accent);
  min-width: 34px;
  text-align: right;
}

.empty-state {
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  padding: 40px 20px;
  font-family: var(--font-mono);
}

.toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel-raised);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 50;
  max-width: 90%;
}
.toast.ok { border-color: var(--ok); color: var(--ok); }
.toast.err { border-color: var(--danger); color: var(--danger); }

/* modal for person detail */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: flex-end;
  z-index: 40;
}
.modal-sheet {
  background: var(--panel);
  border-top: 1px solid var(--line);
  border-radius: 14px 14px 0 0;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 18px;
  max-height: 75vh;
  overflow-y: auto;
}
.modal-sheet h3 {
  font-family: var(--font-display);
  margin: 0 0 10px;
}
.modal-sheet .pkg-row {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  color: var(--text-dim);
}
.modal-sheet .pkg-row span:first-child { color: var(--text); }

</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div>
      <div class="brand">INTAKE<span>·</span></div>
      <div class="tagline">Package Scan &amp; Count</div>
    </div>
  </header>

  <nav class="tabs">
    <button id="tabScan" class="active">Scan</button>
    <button id="tabPeople">People</button>
  </nav>

  <main>

    <!-- ===== Scan view ===== -->
    <section id="viewScan">
      <div class="scan-stage" id="scanStage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="freezeCanvas" class="freeze hidden"></canvas>
        <div class="reticle"><span class="c2"></span><span class="c3"></span></div>
        <div class="scanline" id="scanline"></div>
        <div class="scan-status" id="scanStatus">Point camera at the shipping label</div>
      </div>

      <div class="controls-row">
        <button class="primary" id="captureBtn">Capture Label</button>
        <button class="secondary" id="switchCamBtn" title="Switch camera">⟳</button>
      </div>
    </section>

    <!-- ===== Confirm / packing-slip view ===== -->
    <section id="viewConfirm" class="hidden">
      <div class="slip">
        <div class="slip-eyebrow"><span>Confirm intake</span><span id="slipCarrierTag">—</span></div>

        <div id="dupWarning" class="dup-warning hidden"></div>

        <div class="slip-field">
          <label for="nameField">Recipient name</label>
          <input id="nameField" type="text" placeholder="Type or edit the name" autocomplete="off" />
        </div>

        <div class="slip-field">
          <label for="trackingField">Tracking number</label>
          <input id="trackingField" type="text" placeholder="No barcode detected — enter manually" autocomplete="off" />
        </div>

        <div class="slip-field">
          <label for="carrierField">Carrier</label>
          <select id="carrierField">
            <option value="Unknown">Unknown / other</option>
            <option value="FedEx">FedEx</option>
            <option value="USPS">USPS</option>
            <option value="UPS">UPS</option>
            <option value="Amazon">Amazon Logistics</option>
            <option value="Walmart">Walmart</option>
          </select>
        </div>

        <div class="ocr-raw" id="ocrRaw"></div>
      </div>

      <div class="controls-row" style="margin-top:12px;">
        <button class="secondary" id="rescanBtn">Rescan</button>
        <button class="primary" id="saveBtn">Save package</button>
      </div>
    </section>

    <!-- ===== People view ===== -->
    <section id="viewPeople" class="hidden">
      <div class="people-header">
        <h2>People</h2>
        <span id="peopleCount">— total packages</span>
      </div>
      <div class="people-toolbar">
        <button class="pill danger" id="resetAllBtn">Reset all data</button>
      </div>
      <div id="peopleList"></div>
    </section>

  </main>
</div>

<div id="toastHost"></div>
<div id="modalHost"></div>

<!-- ZXing for barcode decoding -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<!-- Tesseract.js for OCR -->
<script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, getDocs, query,
  orderBy, runTransaction, increment, arrayUnion, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ---------------------------------------------------------------- *
 * Firebase bootstrap — your project, wired in directly.             *
 * ---------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBDoPmpbMecHKbXi7ZokOPkrSAWlZEaBJw",
  authDomain: "bzpackages.firebaseapp.com",
  databaseURL: "https://bzpackages-default-rtdb.firebaseio.com",
  projectId: "bzpackages",
  storageBucket: "bzpackages.firebasestorage.app",
  messagingSenderId: "1037051201503",
  appId: "1:1037051201503:web:221a822cd8fbbd2c43266a",
};

let db = null;

const $ = (id) => document.getElementById(id);

function bootFirebase() {
  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    setTabsEnabled(true);
    return true;
  } catch (e) {
    console.error(e);
    toast("Couldn't connect to Firebase — check the console", "err");
    setTabsEnabled(false);
    return false;
  }
}

/* ---------------------------------------------------------------- *
 * Tabs                                                              *
 * ---------------------------------------------------------------- */
function setTabsEnabled(enabled) {
  $("tabScan").disabled = !enabled;
  $("tabPeople").disabled = !enabled;
}

function show(id) {
  ["viewScan", "viewConfirm", "viewPeople"].forEach((v) => {
    $(v).classList.toggle("hidden", v !== id);
  });
}

function switchTab(tab) {
  $("tabScan").classList.toggle("active", tab === "scan");
  $("tabPeople").classList.toggle("active", tab === "people");
  if (tab === "scan") {
    show("viewScan");
  } else {
    show("viewPeople");
    loadPeople();
  }
}

$("tabScan").addEventListener("click", () => switchTab("scan"));
$("tabPeople").addEventListener("click", () => switchTab("people"));

/* ---------------------------------------------------------------- *
 * Camera                                                            *
 * ---------------------------------------------------------------- */
const video = $("video");
const freezeCanvas = $("freezeCanvas");
let currentStream = null;
let facingMode = "environment";

async function startCamera() {
  stopCamera();
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode } },
      audio: false,
    });
    video.srcObject = currentStream;
    video.classList.remove("hidden");
    freezeCanvas.classList.add("hidden");
  } catch (e) {
    console.error(e);
    setStatus("Couldn't access camera — check browser permissions", false);
  }
}

function stopCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach((t) => t.stop());
    currentStream = null;
  }
}

$("switchCamBtn").addEventListener("click", () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  startCamera();
});

function setStatus(msg, busy) {
  const el = $("scanStatus");
  el.textContent = msg;
  el.className = "scan-status" + (busy === true ? " busy" : busy === false ? "" : "");
}

/* ---------------------------------------------------------------- *
 * Capture -> barcode decode + OCR                                   *
 * ---------------------------------------------------------------- */
let lastOcrText = "";

$("captureBtn").addEventListener("click", capture);

async function capture() {
  if (!video.videoWidth) return;
  $("captureBtn").disabled = true;

  const canvas = freezeCanvas;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.classList.remove("hidden");
  video.classList.add("hidden");
  $("scanline").classList.add("hidden");

  setStatus("Reading barcode + label…", true);

  const [barcode, ocrText] = await Promise.all([
    decodeBarcode(canvas).catch(() => null),
    runOcr(canvas).catch(() => ""),
  ]);

  lastOcrText = ocrText || "";
  setStatus(barcode ? "Barcode found" : "No barcode found — enter tracking # manually", barcode ? undefined : false);

  const trackingNumber = barcode ? barcode.trim() : "";
  const carrier = guessCarrier(trackingNumber);
  const nameGuess = guessName(lastOcrText);

  $("trackingField").value = trackingNumber;
  $("carrierField").value = carrier;
  $("nameField").value = nameGuess;
  $("ocrRaw").textContent = lastOcrText || "(no text recognized)";
  $("slipCarrierTag").textContent = carrier;

  $("dupWarning").classList.add("hidden");
  if (trackingNumber) {
    checkDuplicate(sanitizeId(trackingNumber));
  }

  $("captureBtn").disabled = false;
  show("viewConfirm");
}

async function decodeBarcode(canvas) {
  const dataUrl = canvas.toDataURL("image/png");
  const img = new Image();
  img.src = dataUrl;
  await img.decode();
  const reader = new ZXing.BrowserMultiFormatReader();
  const result = await reader.decodeFromImageElement(img);
  return result.getText();
}

async function runOcr(canvas) {
  const { data } = await Tesseract.recognize(canvas, "eng");
  return (data && data.text) ? data.text.trim() : "";
}

/* ---------------------------------------------------------------- *
 * Heuristics: carrier from tracking number, name from OCR text      *
 * ---------------------------------------------------------------- */
function guessCarrier(rawCode) {
  const code = (rawCode || "").replace(/\s+/g, "").toUpperCase();
  if (!code) return "Unknown";
  if (/^1Z[0-9A-Z]{16}$/.test(code)) return "UPS";
  if (/^TBA\d{9,15}$/.test(code)) return "Amazon";
  if (/^(92|93|94|95|82)\d{18,20}$/.test(code) || /^420\d{5}(91|92|93|94)\d{15,20}$/.test(code)) return "USPS";
  if (/^\d{12}$/.test(code) || /^\d{15}$/.test(code) || /^\d{20}$/.test(code)) return "FedEx";
  return "Unknown";
}

const OCR_STOPWORDS = [
  "USPS", "FEDEX", "UPS", "AMAZON", "WALMART", "PRIORITY", "MAIL", "EXPRESS",
  "GROUND", "SHIP TO", "DELIVER TO", "FROM:", "SIGNATURE", "REQUIRED",
  "STANDARD", "LOGISTICS", "FRAGILE", "THIS SIDE UP", "TRACKING", "WEIGHT",
];

function guessName(ocrText) {
  if (!ocrText) return "";
  const lines = ocrText.split("\n").map((l) => l.trim()).filter(Boolean);
  for (const line of lines) {
    const upper = line.toUpperCase();
    if (OCR_STOPWORDS.some((w) => upper.includes(w))) continue;
    if (/\d/.test(line)) continue; // addresses/zips have digits, names don't
    const words = line.split(/\s+/);
    if (words.length < 2 || words.length > 4) continue;
    if (!/^[A-Za-z][A-Za-z.'-]*(\s+[A-Za-z][A-Za-z.'-]*){1,3}$/.test(line)) continue;
    if (line.length > 34) continue;
    return line.replace(/\s+/g, " ").trim();
  }
  return "";
}

/* ---------------------------------------------------------------- *
 * Confirm screen actions                                            *
 * ---------------------------------------------------------------- */
$("rescanBtn").addEventListener("click", resetToScan);

function resetToScan() {
  show("viewScan");
  video.classList.remove("hidden");
  freezeCanvas.classList.add("hidden");
  $("scanline").classList.remove("hidden");
  setStatus("Point camera at the shipping label");
}

function sanitizeId(str) {
  return str.replace(/\s+/g, "").replace(/[/#?%*[\]]/g, "-");
}

function slugify(name) {
  const s = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  return s || "unknown";
}

async function checkDuplicate(packageId) {
  if (!db) return;
  try {
    const snap = await getDoc(doc(db, "packages", packageId));
    if (snap.exists()) {
      const data = snap.data();
      const w = $("dupWarning");
      w.textContent = `Already logged for ${data.recipientName || "someone"} — saving again will be blocked.`;
      w.classList.remove("hidden");
    }
  } catch (e) {
    console.error(e);
  }
}

$("saveBtn").addEventListener("click", savePackage);

async function savePackage() {
  if (!db) { toast("Connect Firebase first", "err"); return; }
  const name = $("nameField").value.trim();
  if (!name) { toast("Enter a recipient name", "err"); return; }

  const trackingRaw = $("trackingField").value.trim();
  const trackingId = trackingRaw ? sanitizeId(trackingRaw) : `manual-${Date.now()}`;
  const carrier = $("carrierField").value;
  const slug = slugify(name);

  const packageRef = doc(db, "packages", trackingId);
  const personRef = doc(db, "people", slug);

  $("saveBtn").disabled = true;
  try {
    await runTransaction(db, async (tx) => {
      const pkgSnap = await tx.get(packageRef);
      if (pkgSnap.exists()) throw new Error("DUPLICATE");
      const personSnap = await tx.get(personRef);

      tx.set(packageRef, {
        trackingNumber: trackingRaw || null,
        carrier,
        recipientName: name,
        ocrText: lastOcrText || "",
        scannedAt: serverTimestamp(),
      });

      if (personSnap.exists()) {
        tx.update(personRef, {
          displayName: name,
          count: increment(1),
          trackingNumbers: arrayUnion(trackingId),
          updatedAt: serverTimestamp(),
        });
      } else {
        tx.set(personRef, {
          displayName: name,
          count: 1,
          trackingNumbers: [trackingId],
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        });
      }
    });
    toast("Saved ✓", "ok");
    resetToScan();
  } catch (e) {
    if (e.message === "DUPLICATE") {
      toast("That tracking number is already logged", "err");
    } else {
      console.error(e);
      toast("Save failed — see console", "err");
    }
  } finally {
    $("saveBtn").disabled = false;
  }
}

/* ---------------------------------------------------------------- *
 * People view                                                       *
 * ---------------------------------------------------------------- */
async function loadPeople() {
  if (!db) return;
  const listEl = $("peopleList");
  listEl.innerHTML = `<div class="empty-state">Loading…</div>`;
  try {
    const q = query(collection(db, "people"), orderBy("count", "desc"));
    const snap = await getDocs(q);
    if (snap.empty) {
      listEl.innerHTML = `<div class="empty-state">No packages logged yet.<br/>Scan one to get started.</div>`;
      $("peopleCount").textContent = "0 total packages";
      return;
    }
    let total = 0;
    listEl.innerHTML = "";
    snap.forEach((docSnap) => {
      const p = docSnap.data();
      total += p.count || 0;
      const card = document.createElement("div");
      card.className = "person-card";
      card.innerHTML = `
        <div>
          <div class="name">${escapeHtml(p.displayName)}</div>
          <div class="meta">${(p.trackingNumbers || []).length} tracked package${(p.trackingNumbers || []).length === 1 ? "" : "s"}</div>
        </div>
        <div class="count-badge">${p.count || 0}</div>
      `;
      card.addEventListener("click", () => openPersonModal(docSnap.id, p));
      listEl.appendChild(card);
    });
    $("peopleCount").textContent = `${total} total package${total === 1 ? "" : "s"}`;
  } catch (e) {
    console.error(e);
    listEl.innerHTML = `<div class="empty-state">Couldn't load people — check your Firestore rules/connection.</div>`;
  }
}

$("resetAllBtn").addEventListener("click", resetAllData);

async function resetAllData() {
  if (!db) return;
  const sure = confirm("Delete ALL packages and people? This can't be undone.");
  if (!sure) return;
  $("resetAllBtn").disabled = true;
  try {
    const [peopleSnap, pkgSnap] = await Promise.all([
      getDocs(collection(db, "people")),
      getDocs(collection(db, "packages")),
    ]);
    // Firestore batches cap at 500 writes — chunk just in case.
    const allRefs = [...peopleSnap.docs, ...pkgSnap.docs].map((d) => d.ref);
    for (let i = 0; i < allRefs.length; i += 450) {
      const batch = writeBatch(db);
      allRefs.slice(i, i + 450).forEach((ref) => batch.delete(ref));
      await batch.commit();
    }
    toast("All data cleared", "ok");
    loadPeople();
  } catch (e) {
    console.error(e);
    toast("Reset failed — see console", "err");
  } finally {
    $("resetAllBtn").disabled = false;
  }
}

async function openPersonModal(personId, person) {
  const host = $("modalHost");
  const ids = person.trackingNumbers || [];
  host.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-sheet">
        <h3>${escapeHtml(person.displayName)} — ${person.count} package${person.count === 1 ? "" : "s"}</h3>
        <div id="pkgRows"><div class="empty-state">Loading packages…</div></div>
        <button class="secondary" id="closeModalBtn" style="margin-top:12px; width:100%;">Close</button>
      </div>
    </div>
  `;
  $("modalBackdrop").addEventListener("click", (e) => {
    if (e.target.id === "modalBackdrop") host.innerHTML = "";
  });
  $("closeModalBtn").addEventListener("click", () => (host.innerHTML = ""));

  const rows = await Promise.all(
    ids.map(async (id) => {
      try {
        const snap = await getDoc(doc(db, "packages", id));
        if (!snap.exists()) return null;
        const d = snap.data();
        const when = d.scannedAt && d.scannedAt.toDate ? d.scannedAt.toDate().toLocaleDateString() : "";
        return `<div class="pkg-row"><span>${escapeHtml(d.carrier || "Unknown")} · ${escapeHtml(d.trackingNumber || id)}</span><span>${when}</span></div>`;
      } catch {
        return null;
      }
    })
  );
  const rowsEl = $("pkgRows");
  if (rowsEl) rowsEl.innerHTML = rows.filter(Boolean).join("") || `<div class="empty-state">No package details found.</div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------------------------------------------------------------- *
 * Toast                                                              *
 * ---------------------------------------------------------------- */
let toastTimer = null;
function toast(msg, kind) {
  const host = $("toastHost");
  host.innerHTML = `<div class="toast ${kind || ""}">${escapeHtml(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (host.innerHTML = ""), 3200);
}

/* ---------------------------------------------------------------- *
 * Boot                                                               *
 * ---------------------------------------------------------------- */
(function init() {
  if (bootFirebase()) {
    switchTab("scan");
    startCamera();
  }
})();

</script>
